<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE DATA TERMINAL</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { --blue: #00d2ff; --gold: #ffa502; --bg: #0d1117; --card: #1c222b; --border: #30363d; --gray: #8b949e; }
        body { background: var(--bg); color: #e6edf3; font-family: sans-serif; padding: 15px; margin: 0 auto; max-width: 500px; }
        
        .section { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        .label { color: var(--gold); font-size: 12px; font-weight: bold; margin-bottom: 8px; display: block; }
        
        select, input { width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-blue { background: var(--blue); color: #000; }
        .btn-gold { background: var(--gold); color: #000; grid-column: span 2; margin-top: 10px; font-size: 16px; }
        
        .status { font-size: 12px; text-align: center; color: var(--gray); margin-top: 10px; }
    </style>
</head>
<body>

    <h2 style="color: var(--blue); text-align: center;">📊 ELITE 數據終端</h2>

    <div class="section">
        <span class="label">發送維度 & 類型</span>
        <select id="target-player">
            <option value="ALL">📢 全體成員 (群組戰報)</option>
            </select>
        
        <select id="data-type" onchange="toggleInputs()">
            <option value="game_stats">🏆 歷史遊戲戰績 (Total K/D/W)</option>
            <option value="financial_summary">💰 生活雜支 & 結單 (含欠款)</option>
            <option value="smart_split">⚖️ 智慧分錢 (自動結算分配)</option>
        </select>
    </div>

    <div class="section">
        <span class="label">時間範圍 (可選)</span>
        <div style="display: flex; gap: 5px;">
            <input type="date" id="date-start">
            <input type="date" id="date-end">
        </div>
    </div>

    <div class="btn-grid">
        <button class="btn btn-blue" onclick="previewData()">👁️ 預覽數據</button>
        <button class="btn btn-blue" onclick="location.reload()">🔄 刷新數據</button>
        <button class="btn btn-gold" onclick="processAndSend()">🚀 生成並發送卡片</button>
    </div>

    <div id="status" class="status">正在同步 Supabase 資料庫...</div>

<script>
    const API_URL = 'https://nzuxyiefpenwuqudajdw.supabase.co/rest/v1';
    const KEY = 'sb_publishable_7y2n8zIopxlKEhcsJ05D2A_U89IFgae';
    const HEADERS = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };
    const LIFF_ID = "2008868088-9hbWzzlW";

    let players = [], logs = [], expenses = [];

    async function init() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) liff.login();
            await loadAllData();
        } catch (e) { document.getElementById('status').innerText = "初始化失敗"; }
    }

    async function loadAllData() {
        const [pRes, lRes, eRes] = await Promise.all([
            fetch(`${API_URL}/players?select=*`, { headers: HEADERS }),
            fetch(`${API_URL}/game_logs?select=*`, { headers: HEADERS }), // 假設你有這個表
            fetch(`${API_URL}/expenses?select=*`, { headers: HEADERS })  // 假設你有雜支表
        ]);
        players = await pRes.json();
        // 載入玩家清單到下拉選單
        const select = document.getElementById('target-player');
        players.forEach(p => {
            if(!p.name.startsWith('OFF_')) {
                let opt = new Option(`👤 個人：${p.name}`, p.name);
                select.add(opt);
            }
        });
        document.getElementById('status').innerText = "🟢 資料庫連線正常";
    }

    // 核心邏輯：根據選擇生成不同的 Flex 內容
    async function processAndSend() {
        const target = document.getElementById('target-player').value;
        const type = document.getElementById('data-type').value;
        
        let flexContent;
        
        if (type === 'game_stats') {
            flexContent = generateGameFlex(target);
        } else if (type === 'financial_summary') {
            flexContent = generateFinanceFlex(target);
        } else if (type === 'smart_split') {
            flexContent = generateSplitFlex();
        }

        sendToLine(flexContent);
    }

    // 1. 遊戲戰績卡片生成 (示範邏輯)
    function generateGameFlex(target) {
        // 這裡過濾數據... 
        return {
            "type": "bubble",
            "header": { "type": "box", "layout": "vertical", "contents": [{"type": "text", "text": "ELITE 戰績記錄", "color": "#00d2ff", "weight": "bold"}]},
            "body": { "type": "box", "layout": "vertical", "contents": [
                {"type": "text", "text": target === 'ALL' ? "全體總和" : `成員：${target}`, "size": "xl", "color": "#ffffff"},
                {"type": "separator", "margin": "md"},
                {"type": "text", "text": "歷史勝場：150", "color": "#aaaaaa", "margin": "sm"},
                {"type": "text", "text": "上次結單欠額：$500", "color": "#ffa502"}
            ]}
        };
    }

    // 2. 智慧分錢與雜支邏輯
    function generateFinanceFlex(target) {
        // 計算個人或群組雜支...
        return {
            "type": "bubble",
            "body": { "type": "box", "layout": "vertical", "contents": [
                {"type": "text", "text": "💰 財務結單公告", "weight": "bold", "color": "#ffa502"},
                {"type": "text", "text": `對象：${target}`, "margin": "md", "color": "#ffffff"},
                {"type": "box", "layout": "vertical", "margin": "lg", "contents": [
                    {"type": "text", "text": "本期支出：$1,200", "color": "#eeeeee"},
                    {"type": "text", "text": "歷史累積欠款：$3,450", "color": "#ff4757", "size": "sm"}
                ]}
            ]}
        };
    }

    // LINE 發送
    async function sendToLine(flex) {
        try {
            await liff.shareTargetPicker([{ "type": "flex", "altText": "ELITE 數據分析", "contents": flex }]);
        } catch (e) { alert("發送失敗，請檢查權限"); }
    }

    window.onload = init;
</script>
</body>
</html>
