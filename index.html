<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE Ultimate - 整合計算分帳版</title>
    <style>
        :root { --blue: #00d2ff; --red: #ff4757; --green: #2ed573; --gold: #ffa502; --bg: #0d1117; --card: #1c222b; --border: #30363d; --gray: #8b949e; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 12px; padding-bottom: 50px; }
        
        .card { background: var(--card); padding: 18px; border-radius: 20px; margin-bottom: 12px; border: 1px solid var(--border); }
        h2 { font-size: 15px; color: var(--gold); margin: 0 0 15px 0; border-left: 3px solid var(--gold); padding-left: 10px; }
        
        /* 遊戲計算區 */
        .config-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .config-box { background: #000; padding: 8px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .config-box span { font-size: 10px; color: var(--gray); display: block; }
        .big-in { width: 100%; background: none; border: none; color: var(--gold); text-align: center; font-size: 16px; font-weight: bold; outline: none; }
        
        .p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
        .p-btn { padding: 12px 5px; background: #21262d; border: 2px solid var(--border); border-radius: 12px; text-align: center; font-weight: bold; position: relative; cursor: pointer; font-size: 14px; }
        .t-1 { border-color: var(--blue) !important; color: var(--blue); }
        .t-2 { border-color: var(--red) !important; color: var(--red); }
        
        .score-badge { position: absolute; top: -8px; right: -5px; padding: 2px 6px; border-radius: 5px; font-size: 10px; font-weight: 900; }
        .win-tag { background: var(--green); color: #000; }
        .loss-tag { background: var(--red); color: #fff; }

        /* 帳本區 */
        .ledger-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #111; border-radius: 10px; margin-bottom: 8px; border: 1px solid #222; }
        .btn-main { width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; background: var(--gold); color: #000; font-size: 16px; margin-top: 10px; }
        
        .share-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .p-block { background: #000; border: 1px solid #333; border-radius: 10px; padding: 8px; text-align: center; }
        .p-tag { font-size: 11px; color: var(--gray); cursor: pointer; }
        .p-tag.active { color: var(--gold); font-weight: bold; }
        .mini-in { width: 90%; background: #222; border: 1px solid #444; color: #fff; text-align: center; border-radius: 4px; font-size: 11px; margin-top: 4px; }
        
        select, input[type="text"], input[type="number"] { background: #000; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚔️ 遊戲現場計算機</h2>
    <div class="config-grid">
        <div class="config-box"><span>底</span><input id="v-base" class="big-in" type="number" value="75" oninput="render()"></div>
        <div class="config-box"><span>球</span><input id="v-ball" class="big-in" type="number" value="25" oninput="render()"></div>
        <div class="config-box"><span>媽</span><input id="v-egg" class="big-in" type="number" value="50" oninput="render()"></div>
    </div>
    
    <div id="p-grid" class="p-grid"></div>
    
    <div id="game-controls" style="margin-top:15px; display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div style="background:#000; padding:10px; border-radius:10px;">
            <span style="font-size:10px; color:var(--blue)">隊伍 1 球數:</span>
            <input type="number" id="t1-k" value="0" style="text-align:center" oninput="render()">
            <button class="btn-main" style="padding:5px; font-size:12px;" onclick="setWin(1)">標記贏</button>
        </div>
        <div style="background:#000; padding:10px; border-radius:10px;">
            <span style="font-size:10px; color:var(--red)">隊伍 2 球數:</span>
            <input type="number" id="t2-k" value="0" style="text-align:center" oninput="render()">
            <button class="btn-main" style="padding:5px; font-size:12px;" onclick="setWin(2)">標記贏</button>
        </div>
    </div>
    
    <button class="btn-main" style="background:var(--blue); color:#000;" onclick="confirmGameDone()">🚀 結束此局：併入下方帳本</button>
</div>

<div class="card">
    <h2>🍱 生活雜支 / 飲料分攤</h2>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
        <select id="payer-id"></select>
        <input type="number" id="exp-amt" placeholder="金額">
    </div>
    <div id="share-grid" class="share-grid"></div>
    <button class="btn-main" onclick="addExp()">✅ 送出雜支</button>
</div>

<div class="card">
    <h2>👤 永久總帳餘額</h2>
    <div id="ledger-list"></div>
    <button class="btn-main" style="background:none; border:1px solid var(--gold); color:var(--gold);" onclick="runSmartSettle()">💡 結算建議</button>
    <button class="btn-main" style="background:none; border:1px solid var(--gray); color:var(--gray); font-size:10px;" onclick="resetAll()">系統重置</button>
</div>

<script>
// 成員基礎資料
let players = [
    {id: 1, name: "阿明", debt: 0}, {id: 2, name: "小華", debt: 0},
    {id: 3, name: "大強", debt: 0}, {id: 4, name: "老王", debt: 0}
];

// 遊戲狀態 (單局)
let playerTeams = {1:1, 2:1, 3:2, 4:2}; 
let winId = 1;

function calculateCurrentGame() {
    const base = Number(document.getElementById('v-base').value);
    const ball = Number(document.getElementById('v-ball').value);
    const eggU = Number(document.getElementById('v-egg').value);
    
    let sc = {}; players.forEach(p => sc[p.id] = 0);
    const on = players.filter(p => playerTeams[p.id] > 0);
    if (!on.length) return sc;

    let tMems = { 1: on.filter(p => playerTeams[p.id] === 1), 2: on.filter(p => playerTeams[p.id] === 2) };
    const maxN = Math.max(tMems[1].length, tMems[2].length);

    // 底金邏輯
    if (winId && maxN > 0) {
        const teamBase = base * maxN;
        const wins = tMems[winId], loss = tMems[winId === 1 ? 2 : 1];
        if (wins.length && loss.length) {
            loss.forEach(p => sc[p.id] -= (teamBase / loss.length));
            wins.forEach(p => sc[p.id] += (teamBase / wins.length));
        }
    }

    // 球數邏輯
    [1, 2].forEach(tid => {
        const k = Number(document.getElementById(`t${tid}-k`).value);
        if (k <= 0) return;
        const totalBall = (k * ball) * maxN;
        const oppId = tid === 1 ? 2 : 1;
        const mems = tMems[tid], opps = tMems[oppId];
        if (mems.length && opps.length) {
            opps.forEach(p => sc[p.id] -= (totalBall / opps.length));
            mems.forEach(p => sc[p.id] += (totalBall / mems.length));
        }
    });
    return sc;
}

function render() {
    const sc = calculateCurrentGame();
    
    // 遊戲球員區
    document.getElementById('p-grid').innerHTML = players.map(p => {
        const tid = playerTeams[p.id] || 0;
        const s = Math.round(sc[p.id] || 0);
        return `<div class="p-btn t-${tid}" onclick="toggleTeam(${p.id})">
            ${s !== 0 ? `<div class="score-badge ${s>0?'win-tag':'loss-tag'}">${s>0?'+'+s:s}</div>` : ''}
            ${p.name}
        </div>`;
    }).join('');

    // 總帳帳本區
    document.getElementById('ledger-list').innerHTML = players.map(p => `
        <div class="ledger-row">
            <span>👤 ${p.name}</span>
            <b style="color:${p.debt>=0?'var(--green)':'var(--red)'}">${p.debt>=0?'+':''}${Math.round(p.debt)}</b>
        </div>`).join('');

    // 雜支區
    document.getElementById('payer-id').innerHTML = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    document.getElementById('share-grid').innerHTML = players.map(p => `
        <div class="p-block">
            <div class="p-tag active" data-id="${p.id}" onclick="this.classList.toggle('active')">${p.name}</div>
            <input type="number" class="mini-in" data-id="${p.id}" placeholder="指定$">
        </div>`).join('');
}

// 遊戲操作功能
function toggleTeam(pid) { playerTeams[pid] = (playerTeams[pid] + 1) % 3; render(); }
function setWin(id) { winId = id; render(); }

// 核心整合：結單功能
function confirmGameDone() {
    if(!confirm("確定結單嗎？本局金額將會併入下方總帳並歸零球數。")) return;
    const sc = calculateCurrentGame();
    players.forEach(p => p.debt += sc[p.id]);
    // 重置單局球數
    document.getElementById('t1-k').value = 0;
    document.getElementById('t2-k').value = 0;
    render();
}

// 雜支分攤功能
function addExp() {
    const amt = parseFloat(document.getElementById('exp-amt').value) || 0;
    const payerId = parseInt(document.getElementById('payer-id').value);
    if(amt <= 0) return alert("請輸入金額");

    let shares = {}, autoIds = [], manualTotal = 0;
    document.querySelectorAll('.p-block').forEach(b => {
        const id = parseInt(b.querySelector('.p-tag').dataset.id);
        const val = parseFloat(b.querySelector('.mini-in').value) || 0;
        if(val > 0) { shares[id] = val; manualTotal += val; }
        else if(b.querySelector('.p-tag').classList.contains('active')) { autoIds.push(id); }
    });

    const remain = amt - manualTotal;
    if(autoIds.length > 0 && remain > 0) {
        autoIds.forEach(id => shares[id] = (shares[id] || 0) + (remain / autoIds.length));
    }

    players.forEach(p => {
        const diff = (p.id === payerId ? amt : 0) - (shares[p.id] || 0);
        p.debt += diff;
    });
    
    document.getElementById('exp-amt').value = "";
    render();
}

function runSmartSettle() {
    let d = players.filter(p => p.debt < -1).map(p => ({...p})), c = players.filter(p => p.debt > 1).map(p => ({...p})), res = "💡 建議結算：\n";
    d.forEach(db => { c.forEach(cr => { if(db.debt < 0 && cr.debt > 0) { let m = Math.min(Math.abs(db.debt), cr.debt); res += `${db.name} ➜ ${cr.name} : $${Math.round(m)}\n`; db.debt += m; cr.debt -= m; } }); });
    alert(res);
}

function resetAll() { if(confirm("確定重置所有數據？")) { players.forEach(p => p.debt = 0); render(); } }

render();
</script>
</body>
</html>
