<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE v52.0 教學導覽系統</title>
    <style>
        :root { --blue: #00d2ff; --red: #ff4757; --green: #2ed573; --gold: #ffa502; --bg: #0d1117; --card: #1c222b; --border: #30363d; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 15px; }

        /* --- 教學遮罩與氣泡 --- */
        #tutorial-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; display: flex; align-items: center; justify-content: center; text-align: center; }
        .guide-bubble { background: var(--card); border: 2px solid var(--gold); padding: 30px; border-radius: 25px; width: 85%; max-width: 400px; box-shadow: 0 0 30px var(--gold); }
        
        /* --- 跑馬燈動畫 --- */
        #marquee-container { position: fixed; top: 30%; left: 0; width: 100%; background: var(--gold); color: #000; font-weight: 900; padding: 15px 0; overflow: hidden; display: none; z-index: 1000; transform: rotate(-5deg); }
        .marquee-inner { display: inline-block; white-space: nowrap; animation: marquee 1.5s linear infinite; }
        @keyframes marquee { from { transform: translateX(100%); } to { transform: translateX(-100%); } }

        /* --- 成員選擇 UI --- */
        .member-selector { background: var(--card); padding: 15px; border-radius: 18px; margin-bottom: 20px; border: 1px solid var(--border); }
        .member-btn { padding: 8px 12px; margin: 4px; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; cursor: pointer; }
        .member-btn.online { border-color: var(--green); color: var(--green); background: rgba(46, 213, 115, 0.1); }

        /* --- 分析看板 --- */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 15px; border-top: 4px solid var(--blue); }

        /* --- 警告視窗 --- */
        .warn { color: var(--red); font-size: 12px; font-weight: bold; margin-top: 10px; }
        
        /* 原有 UI 保持 */
        .p-btn { padding: 15px; background: #21262d; border: 2.5px solid var(--border); border-radius: 12px; text-align: center; font-weight: bold; }
        .t-1 { border-color: var(--blue); color: var(--blue); }
        .t-2 { border-color: var(--red); color: var(--red); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="tutorial-overlay">
    <div class="guide-bubble">
        <h2 id="guide-title">🏁 歡迎來到新手村</h2>
        <p id="guide-desc">本系統將引導你如何進行公平計分。<br>首先，我們需要先確認誰「上線」了。</p>
        <button class="member-btn" style="background:var(--gold); color:000; width:100%; font-size:18px;" onclick="nextStep()">我準備好了</button>
    </div>
</div>

<div id="marquee-container"><div class="marquee-inner">🎲 隨機分配中... 🎲 命運挑選中... 🎲 隨機分配中...</div></div>

<div id="game-ui">
    <div class="member-selector">
        <h3 style="margin:0 0 10px 0; font-size:16px;">Step 1: 勾選【上線球員】</h3>
        <div id="online-list"></div>
    </div>

    <div class="card" id="scoring-area">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="color:var(--gold)">Step 2: 點擊球員分隊</span>
            <button onclick="runMarquee()" style="background:#444; color:#fff; border:none; padding:8px 15px; border-radius:8px;">🎲 隨機分隊</button>
        </div>
        <div id="p-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"></div>
    </div>

    <div style="background:rgba(255,71,87,0.1); padding:15px; border-radius:15px; margin-top:20px; border:1px solid var(--red);">
        <b style="color:var(--red)">⚠️ 刪除訂單後果警告</b>
        <p class="warn">※ 刪單會導致歷史數據偏差，積分將無法回溯，請確認金額無誤再送出。</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <small>本日總局數</small>
            <div style="font-size:24px; font-weight:bold;">12 局</div>
        </div>
        <div class="stat-card" style="border-color:var(--green)">
            <small>最高連勝</small>
            <div style="font-size:24px; font-weight:bold; color:var(--green)">4 連勝</div>
        </div>
    </div>
</div>

<script>
    // 模擬數據
    const mockPlayers = ["玩家 A", "玩家 B", "玩家 C", "玩家 D", "玩家 E", "玩家 F"];
    let onlineStatus = {};
    let playerTeams = {};
    let step = 0;

    // 初始化清單
    function init() {
        const list = document.getElementById('online-list');
        list.innerHTML = mockPlayers.map(p => `
            <button id="online-${p}" class="member-btn" onclick="toggleOnline('${p}')">${p}</button>
        `).join('');
    }

    // 教學邏輯
    function nextStep() {
        step++;
        const title = document.getElementById('guide-title');
        const desc = document.getElementById('guide-desc');
        
        if(step === 1) {
            document.getElementById('tutorial-overlay').style.display = 'none';
        }
    }

    // 切換上線狀態
    function toggleOnline(name) {
        onlineStatus[name] = !onlineStatus[name];
        document.getElementById(`online-${name}`).className = onlineStatus[name] ? "member-btn online" : "member-btn";
        renderPGrid();
    }

    // 渲染計分板
    function renderPGrid() {
        const grid = document.getElementById('p-grid');
        const activeOnes = mockPlayers.filter(p => onlineStatus[p]);
        
        if(activeOnes.length === 0) {
            grid.innerHTML = "<p style='color:#555'>請先在上方勾選球員...</p>";
            return;
        }

        grid.innerHTML = activeOnes.map(p => {
            const t = playerTeams[p] || 0;
            return `<div class="p-btn t-${t}" onclick="toggleTeam('${p}')">${p}</div>`;
        }).join('');
    }

    function toggleTeam(name) {
        playerTeams[name] = ((playerTeams[name] || 0) + 1) % 3;
        renderPGrid();
    }

    // 跑馬燈功能
    function runMarquee() {
        const marquee = document.getElementById('marquee-container');
        marquee.style.display = 'block';
        
        setTimeout(() => {
            marquee.style.display = 'none';
            // 隨機分隊邏輯
            const activeOnes = mockPlayers.filter(p => onlineStatus[p]);
            activeOnes.forEach(p => {
                playerTeams[p] = Math.floor(Math.random() * 2) + 1;
            });
            renderPGrid();
        }, 1500);
    }

    init();
</script>
</body>
</html>
