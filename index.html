<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE v51.0 - 互動測試版</title>
    <style>
        :root { --blue: #00d2ff; --red: #ff4757; --green: #2ed573; --gold: #ffa502; --bg: #0d1117; --card: #1c222b; --border: #30363d; --gray: #8b949e; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 12px; font-size: 16px; }
        
        /* 基礎 UI */
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .config-box { background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .big-in { width: 65px; background: #000; border: 1px solid #444; color: var(--gold); text-align: center; border-radius: 8px; font-size: 18px; padding: 5px; font-weight: bold; }
        
        .p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; margin-top: 10px; }
        .p-btn { padding: 18px 5px; background: #21262d; border: 2.5px solid var(--border); border-radius: 15px; text-align: center; font-weight: bold; font-size: 18px; cursor: pointer; position: relative; }
        
        .t-0 { border-color: #444; color: #888; }
        .t-1 { border-color: var(--blue) !important; color: var(--blue); }
        .t-2 { border-color: var(--red) !important; color: var(--red); }

        .card { background: var(--card); padding: 18px; border-radius: 20px; margin-bottom: 12px; border: 1px solid var(--border); }
        .score-badge { position: absolute; top: -10px; right: -5px; padding: 2px 10px; border-radius: 8px; font-size: 14px; font-weight: 900; }
        .win-tag { background: var(--green); color: #000; }
        .loss-tag { background: var(--red); color: #fff; }

        .egg-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .egg-circle { width: 45px; height: 45px; border-radius: 50%; border: 2px dashed #444; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }
        .egg-circle.active { background: var(--gold); color: #000; border: 2px solid #fff; transform: scale(1.1); }

        .win-btn { width: 100%; padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid #444; background: #21262d; color: #fff; font-weight: bold; cursor: pointer; }
        .win-btn.active { background: var(--green); color: #000; border-color: #fff; }

        /* 教學小文字 */
        .guide-text { font-size: 11px; color: var(--gray); margin-top: 5px; display: block; line-height: 1.4; }
        
        /* 原理按鈕 */
        .principle-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; margin-bottom: 30px; }
        .p-btn-action { padding: 12px; border-radius: 10px; border: 1px solid var(--gold); background: none; color: var(--gold); font-size: 13px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<h3 style="text-align:center; color: var(--blue);">🧪 ELITE v51.0 互動測試場</h3>

<div id="tab-game">
    <div class="config-grid">
        <div class="config-box">
            <span>底金</span><input id="v-base" class="big-in" type="number" value="75" oninput="testUpdate()">
        </div>
        <div class="config-box">
            <span>2媽倍</span><input id="v-m2" class="big-in" type="number" value="3" oninput="testUpdate()">
        </div>
    </div>
    <span class="guide-text">💡 測試說明：修改上方數值或點擊下方玩家、媽球，標籤分數會即時跳轉。</span>

    <div class="card">
        <div class="p-grid" id="test-p-grid">
            </div>
        <span class="guide-text">👆 點擊球員：可切換 藍隊 / 紅隊 / 沒參加。右上角為本局預計得分。</span>
    </div>
    
    <div id="test-team-list">
        <div class="card" style="border-left:8px solid var(--blue);">
            <b style="font-size:18px;">藍隊 (Team 1)</b>
            <div class="egg-group" id="eggs-t1">
                <div class="egg-circle" onclick="adjE(1,1)">1媽</div>
                <div class="egg-circle" onclick="adjE(1,2)">2媽</div>
                <div class="egg-circle" onclick="adjE(1,3)">3媽</div>
            </div>
            <button id="win-btn-1" class="win-btn" onclick="setWin(1)">標記此隊贏 (收底金)</button>
        </div>

        <div class="card" style="border-left:8px solid var(--red);">
            <b style="font-size:18px;">紅隊 (Team 2)</b>
            <div class="egg-group" id="eggs-t2">
                <div class="egg-circle" onclick="adjE(2,1)">1媽</div>
                <div class="egg-circle" onclick="adjE(2,2)">2媽</div>
                <div class="egg-circle" onclick="adjE(2,3)">3媽</div>
            </div>
            <button id="win-btn-2" class="win-btn" onclick="setWin(2)">標記此隊贏 (收底金)</button>
        </div>
    </div>

    <div class="principle-row">
        <button class="p-btn-action" onclick="alert('【底金公式】\n贏家從每支輸家隊伍領取一份底金。\n公式：底金 x 最大隊伍人數。\n若 3vs3，底金75，贏家每人拿75分。')">⚖️ 底金原理</button>
        <button class="p-btn-action" onclick="alert('【媽球計算】\n(我隊媽球倍率 - 敵隊媽球倍率) x 媽價 x 最大人數。\n1媽=1倍, 2媽=設定倍率(如3倍), 3媽=4倍。')">🥚 媽球原理</button>
    </div>
</div>

<script>
    // 測試資料
    let testPlayers = [
        {id: 1, name: "測試員A", tid: 1},
        {id: 2, name: "測試員B", tid: 1},
        {id: 3, name: "測試員C", tid: 2},
        {id: 4, name: "測試員D", tid: 2}
    ];
    let testWinId = 0;
    let testTeams = {
        1: { e: 0 },
        2: { e: 0 }
    };

    function testUpdate() {
        const base = Number(document.getElementById('v-base').value);
        const m2Mult = Number(document.getElementById('v-m2').value);
        const eggU = 50; // 固定媽價測試
        const mults = { 0:0, 1:1, 2:m2Mult, 3:4, 4:6 };

        let sc = {};
        testPlayers.forEach(p => sc[p.id] = 0);

        const on = testPlayers.filter(p => p.tid > 0);
        if (!on.length) { renderTest([]); return; }

        let teamMems = { 1: on.filter(p => p.tid === 1), 2: on.filter(p => p.tid === 2) };
        const maxN = Math.max(teamMems[1].length, teamMems[2].length);

        // 簡易底金計算
        if (testWinId && maxN > 0) {
            const teamBase = base * maxN;
            const loseId = testWinId === 1 ? 2 : 1;
            
            if (teamMems[testWinId].length && teamMems[loseId].length) {
                teamMems[loseId].forEach(p => sc[p.id] -= (teamBase / teamMems[loseId].length));
                teamMems[testWinId].forEach(p => sc[p.id] += (teamBase / teamMems[testWinId].length));
            }
        }

        // 簡易媽球計算
        const t1EggVal = eggU * mults[testTeams[1].e] * maxN;
        const t2EggVal = eggU * mults[testTeams[2].e] * maxN;
        
        if (teamMems[1].length) teamMems[1].forEach(p => sc[p.id] += (t1EggVal - t2EggVal) / teamMems[1].length);
        if (teamMems[2].length) teamMems[2].forEach(p => sc[p.id] += (t2EggVal - t1EggVal) / teamMems[2].length);

        renderTest(sc);
    }

    function renderTest(sc) {
        // 渲染球員
        document.getElementById('test-p-grid').innerHTML = testPlayers.map(p => {
            const s = Math.round(sc[p.id] || 0);
            return `<div class="p-btn t-${p.tid}" onclick="togglePT(${p.id})">
                ${s !== 0 ? `<div class="score-badge ${s>0?'win-tag':'loss-tag'}">${s>0?'+'+s:s}</div>` : ''}
                ${p.name}
            </div>`;
        }).join('');

        // 渲染媽球與贏家狀態
        [1,2].forEach(tid => {
            const eggContainer = document.getElementById(`eggs-t1`); // 簡化處理
            document.querySelectorAll(`#eggs-t${tid} .egg-circle`).forEach((el, idx) => {
                el.classList.toggle('active', testTeams[tid].e === (idx + 1));
            });
            const wBtn = document.getElementById(`win-btn-${tid}`);
            wBtn.classList.toggle('active', testWinId === tid);
            wBtn.innerText = testWinId === tid ? "🏆 贏家 (已收底金)" : "標記此隊贏";
        });
    }

    function togglePT(pid) {
        const p = testPlayers.find(x => x.id === pid);
        p.tid = (p.tid + 1) % 3;
        testUpdate();
    }

    function adjE(tid, n) {
        testTeams[tid].e = (testTeams[tid].e === n ? 0 : n);
        testUpdate();
    }

    function setWin(tid) {
        testWinId = (testWinId === tid ? 0 : tid);
        testUpdate();
    }

    // 初始化
    testUpdate();
</script>
</body>
</html>
