<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE v53.0 Pro Tutorial</title>
    <style>
        :root { --blue: #00d2ff; --red: #ff4757; --green: #2ed573; --gold: #ffa502; --bg: #0d1117; --card: #1c222b; --border: #30363d; --gray: #8b949e; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 12px; }

        /* 頂部教學跑馬燈 */
        .tutorial-bar { background: linear-gradient(90deg, #1e293b, #0f172a); border-left: 4px solid var(--gold); padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; animation: glow 2s infinite; }
        @keyframes glow { 0%, 100% { border-color: var(--gold); } 50% { border-color: #fff; } }

        /* 模式切換 */
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 12px; text-align: center; border-radius: 10px; background: var(--card); border: 1px solid var(--border); font-size: 14px; color: var(--gray); }
        .tab.active { background: var(--blue); color: #000; font-weight: bold; border: none; }

        /* 球員選擇區 (上線功能) */
        .online-section { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 15px; }
        .p-pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
        .p-chip { padding: 8px; background: #000; border: 1px solid #444; border-radius: 8px; text-align: center; font-size: 13px; opacity: 0.5; transition: 0.3s; }
        .p-chip.active { opacity: 1; border-color: var(--green); color: var(--green); box-shadow: 0 0 8px rgba(46, 213, 115, 0.2); }

        /* 隊伍卡片 UI (恢復原樣) */
        .team-card { background: var(--card); padding: 18px; border-radius: 20px; margin-bottom: 15px; border-left: 6px solid #444; position: relative; }
        .team-1 { border-color: var(--blue); }
        .team-2 { border-color: var(--red); }
        .score-display { font-size: 28px; font-weight: 900; color: var(--gold); }

        /* 模擬分析圖表感 */
        .analysis-box { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid var(--border); margin-top: 15px; }
        .bar-wrap { height: 10px; background: #333; border-radius: 5px; margin: 10px 0; overflow: hidden; display: flex; }
        .bar-fill { height: 100%; transition: 0.5s; }

        /* 隨機分配跑馬燈 */
        #marquee { position: fixed; top: 40%; left: 0; width: 100%; background: var(--gold); color: #000; font-weight: bold; padding: 10px; z-index: 100; display: none; }
        
        .btn-main { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .btn-green { background: var(--green); color: #000; }
        .btn-outline { background: none; border: 1px solid var(--gray); color: var(--gray); margin-top: 5px; }
    </style>
</head>
<body>

<div class="tutorial-bar" id="guide-text">
    💡 <b>新手引導：</b>請先在下方【球員池】勾選目前在場的成員。
</div>

<div class="tabs">
    <div class="tab active" onclick="showTab('game')">⚔️ 戰場計分</div>
    <div class="tab" onclick="showTab('stats')">📊 數據分析</div>
</div>

<div id="tab-game">
    <div class="online-section">
        <div style="font-size: 12px; color: var(--gray); margin-bottom: 8px;">STEP 1: 選擇上線名單</div>
        <div class="p-pool" id="p-pool"></div>
    </div>

    <button class="btn-main btn-outline" onclick="startMarquee()">🎲 隨機分隊 (跑馬燈)</button>
    <div id="marquee">正在隨機計算命運對手... 🎲 🎲 🎲 正在隨機計算命運對手...</div>

    <div id="team-area" style="margin-top: 20px;">
        <div class="team-card team-1">
            <div style="display:flex; justify-content:space-between;">
                <span>藍隊 (Team A)</span>
                <span class="score-display" id="t1-score">0</span>
            </div>
            <div id="t1-members" style="margin: 10px 0; min-height: 40px;"></div>
            <div style="display:flex; gap:5px;">
                <button class="btn-main" style="flex:1; background:var(--blue); color:#000;" onclick="setWinner(1)">🏆 標記獲勝</button>
                <button class="btn-main" style="flex:1; background:#333; color:#fff;" onclick="addEgg(1)">🥚 +1 媽</button>
            </div>
        </div>

        <div class="team-card team-2">
            <div style="display:flex; justify-content:space-between;">
                <span>紅隊 (Team B)</span>
                <span class="score-display" id="t2-score">0</span>
            </div>
            <div id="t2-members" style="margin: 10px 0; min-height: 40px;"></div>
            <div style="display:flex; gap:5px;">
                <button class="btn-main" style="flex:1; background:var(--red); color:#fff;" onclick="setWinner(2)">🏆 標記獲勝</button>
                <button class="btn-main" style="flex:1; background:#333; color:#fff;" onclick="addEgg(2)">🥚 +1 媽</button>
            </div>
        </div>
    </div>

    <button class="btn-main btn-green" onclick="submitOrder()">🚀 確認送單 (寫入數據庫)</button>
    <p style="text-align:center; color:var(--red); font-size:11px; margin-top:8px;">⚠️ 提醒：送單後將正式計入分析數據，請務必核對。</p>
</div>

<div id="tab-stats" class="hidden">
    <div class="analysis-box">
        <h3>📈 本日戰力分析</h3>
        <p style="font-size:12px; color:var(--gray);">依據歷史 50 筆模擬訂單分析</p>
        
        <div style="margin-top:20px;">
            <div style="display:flex; justify-content:space-between; font-size:13px;">
                <span>藍隊勝率 (60%)</span>
                <span>紅隊勝率 (40%)</span>
            </div>
            <div class="bar-wrap">
                <div class="bar-fill" style="width: 60%; background: var(--blue);"></div>
                <div class="bar-fill" style="width: 40%; background: var(--red);"></div>
            </div>
        </div>

        <div style="margin-top:20px; display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div style="background:#000; padding:10px; border-radius:8px; text-align:center;">
                <small>總累積底金</small>
                <div style="color:var(--gold); font-size:20px;">$4,500</div>
            </div>
            <div style="background:#000; padding:10px; border-radius:8px; text-align:center;">
                <small>總累積媽價</small>
                <div style="color:var(--gold); font-size:20px;">$1,250</div>
            </div>
        </div>
    </div>
</div>

<script>
    const players = ["阿明", "小華", "大強", "老王", "阿斯", "杰哥", "凱文", "艾力"];
    let onlineSet = new Set();
    let teams = { 1: [], 2: [] };
    let eggs = { 1: 0, 2: 0 };
    let winner = null;

    function init() {
        const pool = document.getElementById('p-pool');
        pool.innerHTML = players.map(p => `
            <div id="pool-${p}" class="p-chip" onclick="toggleOnline('${p}')">${p}</div>
        `).join('');
    }

    function toggleOnline(name) {
        if(onlineSet.has(name)) onlineSet.delete(name);
        else onlineSet.add(name);
        
        document.getElementById(`pool-${name}`).classList.toggle('active');
        document.getElementById('guide-text').innerHTML = "💡 <b>新手引導：</b>點擊【隨機分隊】或手動點選球員進入隊伍。";
        renderTeams();
    }

    function renderTeams() {
        // 這裡模擬簡化後的分隊呈現，實際應有更複雜的切換邏輯
        const t1div = document.getElementById('t1-members');
        const t2div = document.getElementById('t2-members');
        // ... 渲染邏輯
    }

    function startMarquee() {
        if(onlineSet.size < 2) return alert("至少需要 2 人上線才能分隊！");
        const mq = document.getElementById('marquee');
        mq.style.display = 'block';
        setTimeout(() => {
            mq.style.display = 'none';
            alert("隨機分隊完成！(教學展示)");
            document.getElementById('guide-text').innerHTML = "💡 <b>新手引導：</b>現在點擊隊伍下方的【🏆 標記獲勝】來試算底金。";
        }, 1500);
    }

    function showTab(type) {
        document.getElementById('tab-game').classList.toggle('hidden', type !== 'game');
        document.getElementById('tab-stats').classList.toggle('hidden', type !== 'stats');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function submitOrder() {
        if(confirm("送單後歷史紀錄將永久增加一筆，並同步至數據分析。確定送出？")) {
            alert("送單成功！數據已寫入。");
        }
    }

    init();
</script>
</body>
</html>
