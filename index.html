<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ELITE v53.5 - 專業修復版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght=700&family=Inter:wght=400;700;900&display=swap');

        :root { 
            --blue: #00d2ff; --red: #ff4757; --green: #2ed573; --gold: #fbc531; 
            --bg: #05070a; --card: #12141c; --border: #1e222e; --gray: #7f8c8d;
            --safe-bottom: env(safe-area-inset-bottom);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); color: #e1e1e1; margin: 0; padding: 12px; font-size: 16px; 
            padding-bottom: calc(100px + var(--safe-bottom));
        }

        b, .big-in, .score-badge, .t-detail { font-family: 'JetBrains Mono', monospace; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        /* 導航 */
        .nav-bar { display: flex; gap: 8px; margin-bottom: 15px; }
        .nav-link { flex: 1; padding: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: var(--gray); text-align: center; text-decoration: none; font-size: 11px; font-weight: 700; cursor: pointer; }
        
        .tabs { display: flex; gap: 4px; margin-bottom: 15px; background: #000; padding: 4px; border-radius: 14px; border: 1px solid var(--border); }
        .tab { flex: 1; padding: 10px; text-align: center; border-radius: 10px; color: var(--gray); font-weight: 900; font-size: 14px; cursor: pointer; }
        .tab.active { background: var(--blue); color: #000; }

        /* 設定 */
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .config-box { background: var(--card); padding: 10px 15px; border-radius: 12px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
        .big-in { width: 50px; background: transparent; border: none; color: var(--gold); text-align: right; font-size: 18px; font-weight: 900; }

        /* 隊伍卡片 */
        .card { background: var(--card); padding: 18px; border-radius: 20px; margin-bottom: 12px; border: 1px solid var(--border); position: relative; }
        .t-detail { font-size: 11px; color: var(--gray); line-height: 1.4; margin-top: 8px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 10px; }
        .del-team { position: absolute; top: 15px; right: 15px; color: var(--gray); font-size: 18px; border: none; background: none; }

        /* 媽球 */
        .egg-group { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .egg-circle { 
            width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--border); 
            display: flex; align-items: center; justify-content: center; font-size: 11px; 
            color: var(--gray); transition: 0.3s; background: #000; font-weight: 900; cursor: pointer;
        }
        .egg-circle.active { background: var(--gold); color: #000; transform: scale(1.1); }

        /* 成員按鈕 */
        .p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
        .p-btn { padding: 15px 5px; background: var(--card); border: 1px solid var(--border); border-radius: 15px; text-align: center; font-weight: 900; font-size: 15px; position: relative; cursor: pointer; }
        .t-1 { border: 2.5px solid var(--blue); color: var(--blue); }
        .t-2 { border: 2.5px solid var(--red); color: var(--red); }
        .t-3 { border: 2.5px solid #a855f7; color: #a855f7; }
        .t-4 { border: 2.5px solid #ec4899; color: #ec4899; }
        .score-badge { position: absolute; top: -5px; right: -3px; padding: 2px 5px; border-radius: 4px; font-size: 10px; }
        .win-tag { background: var(--green); color: #000; }
        .loss-tag { background: var(--red); color: #fff; }

        /* 快速上線 */
        .quick-online { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 12px; }
        .q-btn { padding: 6px 12px; background: #1a1d26; border: 1px solid var(--border); border-radius: 8px; color: var(--gray); font-size: 12px; cursor: pointer; }

        /* 底部 */
        .bottom-action { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px 20px calc(15px + var(--safe-bottom)); background: linear-gradient(0deg, var(--bg) 80%, transparent); z-index: 1000; }
        .send-btn { width: 100%; padding: 18px; background: var(--green); color: #000; border: none; border-radius: 18px; font-weight: 900; font-size: 18px; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.3); cursor: pointer; }

        .player-row { display: flex; justify-content: space-between; padding: 14px; background: rgba(255,255,255,0.02); border-radius: 14px; margin-bottom: 8px; border: 1px solid var(--border); align-items: center; }
        .offline-btn { background: #1a1a1a; border: 1px dashed #333; color: var(--gray); padding: 12px; border-radius: 12px; font-size: 13px; text-align: center; cursor: pointer; }
        .hidden { display: none; }
        .history-item { background: #000; padding: 12px; border-radius: 12px; margin-bottom: 10px; border-left: 4px solid var(--gold); font-size: 12px; line-height: 1.5; }

        /* 模式切換按鈕與遮罩樣式 */
        .mode-toggle-btn { font-weight: 900; font-size: 11px; border-radius: 10px; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .online-ui { background: rgba(46, 213, 115, 0.15) !important; color: var(--green) !important; border: 1px solid var(--green) !important; }
        .offline-ui { background: rgba(251, 197, 49, 0.15) !important; color: var(--gold) !important; border: 1px solid var(--gold) !important; }
        
        .disabled-overlay-box { position: relative; }
        .disabled-overlay-box::after { content: "⚠️ 資料庫離線中\n採用本地化運作"; white-space: pre-line; text-align: center; font-weight: 900; font-size: 16px; color: var(--red); position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5, 7, 10, 0.85); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 99; border-radius: 20px; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div id="mode-checker" onclick="toggleManualMode()" class="nav-link mode-toggle-btn online-ui">🔄 模式檢查中...</div>
    <a href="#" onclick="allOffline()" class="nav-link" style="color:var(--red)">💤 全員休息</a>
</div>

<div class="tabs">
    <div id="tab-btn-game" class="tab active" onclick="showTab('game')">戰場</div>
    <div id="tab-btn-wallet" class="tab" onclick="showTab('wallet')">成員管理</div>
    <div id="tab-btn-history" class="tab" onclick="showTab('history')">歷史記錄</div>
</div>

<div id="tab-game">
    <!-- 設定 -->
    <div class="config-grid">
        <div class="config-box"><span>底金</span><input id="v-base" class="big-in" type="number" value="75" oninput="render()"></div>
        <div class="config-box"><span>球價</span><input id="v-ball" class="big-in" type="number" value="25" oninput="render()"></div>
        <div class="config-box"><span>媽球</span><input id="v-egg" class="big-in" type="number" value="50" oninput="render()"></div>
        <div class="config-box"><span>2媽倍</span><input id="v-m2" class="big-in" type="number" value="3" oninput="render()"></div>
    </div>

    <!-- 離線模式專用：新增本地化玩家 -->
    <div id="local-player-panel" class="card" style="padding: 12px; margin-bottom: 12px; border: 1px dashed var(--gold); display: none;">
        <div style="font-size: 12px; font-weight: 900; color: var(--gold); margin-bottom: 8px;">➕ 新增本地臨時玩家 (離線紀錄)</div>
        <div style="display: flex; gap: 8px;">
            <input id="local-p-name" type="text" placeholder="請輸入本地玩家姓名" style="flex: 1; background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 10px; font-size: 14px;">
            <button onclick="addLocalPlayer()" style="background: var(--gold); color: #000; border: none; padding: 0 16px; border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer;">加入戰場</button>
        </div>
    </div>

    <!-- 球員列表 -->
    <div class="card" style="padding: 15px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
            <b style="color:var(--gray); font-size: 12px;">當前上線球員</b>
            <button onclick="runShuffle()" style="background:var(--gold); color:#000; border:none; padding:6px 14px; border-radius:8px; font-weight:900; font-size:12px;">🎰 隨機分組</button>
        </div>
        <div id="p-grid" class="p-grid"></div>
        
        <div style="margin-top:15px; font-size:11px; color:var(--gray);">快速上線：</div>
        <div id="quick-offline" class="quick-online"></div>
    </div>

    <div id="team-list"></div>
    <button onclick="addTeam()" style="width:100%; padding:15px; background:transparent; color:var(--gray); border:1px dashed var(--border); border-radius:15px; font-weight:700; margin-bottom:20px; cursor: pointer;">＋ 增加分組隊伍</button>
</div>

<!-- 成員管理 -->
<div id="tab-wallet" class="hidden">
    <div id="wallet-card-wrapper" class="card">
        <div style="display:flex; gap:8px; margin-bottom:20px;">
            <input id="new-p" type="text" placeholder="輸入姓名" style="flex:1; background:#000; border:1px solid var(--border); color:#fff; padding:12px; border-radius:12px;">
            <button onclick="addPlayer()" style="background:var(--blue); color:#000; border:none; padding:0 20px; border-radius:12px; font-weight:900; cursor: pointer;">加入</button>
        </div>
        
        <div id="wallet-online"></div>
        
        <div style="margin: 25px 0 10px; color: var(--gray); font-weight: 900; font-size: 11px;">休息中 (點擊上線)</div>
        <div id="wallet-offline" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;"></div>
        
        <div id="multi-confirm" style="display:none; margin-top:20px;">
            <button onclick="showTab('game')" style="width:100%; padding:15px; background:var(--blue); color:#000; border:none; border-radius:12px; font-weight:900; cursor: pointer;">✅ 選好了，回戰場</button>
        </div>

        <button onclick="settleFinal()" style="width:100%; padding:20px; background:none; border:2px solid var(--gold); border-radius:20px; margin-top:40px; font-weight:900; color:var(--gold); font-size:16px; cursor: pointer;">💰 當日結單・金額清零</button>
    </div>
</div>

<div id="tab-history" class="hidden">
    <div id="order-history"></div>
</div>

<div id="action-bar" class="bottom-action">
    <button onclick="sendOrder()" class="send-btn">🚀 紀錄此局分數</button>
</div>

<script>
const API_URL = 'https://nzuxyiefpenwuqudajdw.supabase.co/rest/v1';
const KEY = 'sb_publishable_7y2n8zIopxlKEhcsJ05D2A_U89IFgae';
const HEADERS = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

let players = [], matches = [], teams = [{id:1, e:0, targetK:{}}, {id:2, e:0, targetK:{}}], playerTeams = {}, winId = 0;
let isOfflineMode = false; 

// 帶超時控制的 fetch 封裝，防止連線測試時卡死
function fetchWithTimeout(url, options, timeout = 1500) {
    return Promise.race([
        fetch(url, options),
        new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), timeout))
    ]);
}

// 系統初始化入口
async function init() {
    // 優先讀取本地緩存，確保界面立刻有東西可以操作，不卡死
    const localP = localStorage.getItem('local_players');
    const localH = localStorage.getItem('local_history');
    players = localP ? JSON.parse(localP) : [{id: 101, name: '本地玩家A', money: 0}, {id: 102, name: '本地玩家B', money: 0}];
    matches = localH ? JSON.parse(localH) : [];
    render();

    // 如果使用者先前已手動鎖定離線
    if(localStorage.getItem('manual_offline') === 'true') {
        enableOfflineMode("💤 本地化運作 (手動)");
        return;
    }

    try {
        // 使用 1.5 秒超時測試，超時直接判定斷線進本地
        const testCheck = await fetchWithTimeout(`${API_URL}/players?select=id&limit=1`, { headers: HEADERS, method: 'GET' }, 1500);
        if(!testCheck.ok) throw new Error("Database Offline");

        // 連線成功，獲取最新雲端數據
        const [pRes, hRes] = await Promise.all([
            fetch(`${API_URL}/players?select=*`, { headers: HEADERS }),
            fetch(`${API_URL}/history?select=*&order=created_at.desc`, { headers: HEADERS })
        ]);
        players = await pRes.json();
        matches = await hRes.json();
        
        isOfflineMode = false;
        const switcher = document.getElementById('mode-checker');
        switcher.innerText = "🌐 線上雲端模式";
        switcher.className = "nav-link mode-toggle-btn online-ui";
        
        document.getElementById('wallet-card-wrapper').classList.remove('disabled-overlay-box');
        document.getElementById('local-player-panel').style.display = 'none';

        // 備份到本地
        localStorage.setItem('local_players', JSON.stringify(players));
        localStorage.setItem('local_history', JSON.stringify(matches));
        render();
    } catch(e) { 
        // 任何一個步驟超時或失敗，立刻切換至本地，絕不卡住網頁
        enableOfflineMode("💤 本地化運作 (斷線自動)");
    }
}

// 啟用離線本地模式 UI
function enableOfflineMode(statusText) {
    isOfflineMode = true;
    const switcher = document.getElementById('mode-checker');
    switcher.innerText = statusText;
    switcher.className = "nav-link mode-toggle-btn offline-ui";
    
    document.getElementById('wallet-card-wrapper').classList.add('disabled-overlay-box');
    document.getElementById('local-player-panel').style.display = 'block';

    const localP = localStorage.getItem('local_players');
    const localH = localStorage.getItem('local_history');
    if (localP) players = JSON.parse(localP);
    if (localH) matches = JSON.parse(localH);
    render();
}

// 手動切換模式按鈕（隨時可點，不受連線狀態限制）
function toggleManualMode() {
    if(isOfflineMode) {
        localStorage.removeItem('manual_offline');
        const switcher = document.getElementById('mode-checker');
        switcher.innerText = "🔄 重新連線中...";
        switcher.className = "nav-link mode-toggle-btn online-ui";
        init();
    } else {
        if(confirm("是否切換為【本地化運作模式】？\n此模式下將直接在手機本地紀錄，不傳輸至雲端。")) {
            localStorage.setItem('manual_offline', 'true');
            enableOfflineMode("💤 本地化運作 (手動)");
        }
    }
}

// 新增本地玩家
function addLocalPlayer() {
    const inputEl = document.getElementById('local-p-name');
    const name = inputEl.value.trim();
    if (!name) return alert("請輸入有效的玩家姓名");
    
    const nextId = players.length ? Math.max(...players.map(p => p.id)) + 1 : 1001;
    const newLocalPlayer = { id: nextId, name: name, money: 0 };
    
    players.push(newLocalPlayer);
    localStorage.setItem('local_players', JSON.stringify(players));
    inputEl.value = '';
    render();
}

// 數據更新封裝
async function patch(id, d) { 
    const idx = players.findIndex(p => p.id === id);
    if(idx !== -1) players[idx] = { ...players[idx], ...d };

    if (isOfflineMode) {
        localStorage.setItem('local_players', JSON.stringify(players));
        return true; 
    } else {
        try {
            return await fetch(`${API_URL}/players?id=eq.${id}`, { method: 'PATCH', headers: HEADERS, body: JSON.stringify(d) });
        } catch(e) {
            localStorage.setItem('local_players', JSON.stringify(players));
        }
    }
}

// 核心計算
function calculate() {
    const base = Number(document.getElementById('v-base').value);
    const ball = Number(document.getElementById('v-ball').value);
    const eggU = Number(document.getElementById('v-egg').value);
    const m2Mult = Number(document.getElementById('v-m2').value);
    const mults = { 0:0, 1:1, 2:m2Mult, 3:4, 4:6 };
    let sc = {}; 
    const on = players.filter(p => playerTeams[p.id] > 0);
    on.forEach(p => sc[p.id] = 0);
    if (!on.length) return { sc };
    let teamMemsMap = {};
    teams.forEach(t => { teamMemsMap[t.id] = on.filter(p => playerTeams[p.id] === t.id); });
    const counts = Object.values(teamMemsMap).map(m => m.length);
    const maxN = Math.max(...counts, 0);

    if (winId && maxN > 0) {
        const teamBase = base * maxN;
        const winners = teamMemsMap[winId];
        const losersTeams = teams.filter(t => t.id !== winId && teamMemsMap[t.id].length > 0);
        losersTeams.forEach(lt => {
            const mems = teamMemsMap[lt.id];
            const perPersonLoss = teamBase / mems.length;
            mems.forEach(p => sc[p.id] -= perPersonLoss);
        });
        const totalWinPool = losersTeams.length * teamBase;
        if(winners.length > 0) winners.forEach(p => sc[p.id] += (totalWinPool / winners.length));
    }
    teams.forEach(t => {
        const teamMems = teamMemsMap[t.id];
        if (!teamMems.length) return;
        if (t.e > 0) {
            const eggBase = (eggU * (mults[t.e] || 0)) * maxN;
            const otherTeams = teams.filter(ot => ot.id !== t.id && teamMemsMap[ot.id].length > 0);
            otherTeams.forEach(ot => {
                const mems = teamMemsMap[ot.id];
                mems.forEach(p => sc[p.id] -= (eggBase / mems.length));
            });
            teamMems.forEach(p => sc[p.id] += ((otherTeams.length * eggBase) / teamMems.length));
        }
        for (let targetTid in t.targetK) {
            const cnt = t.targetK[targetTid];
            if (cnt > 0 && teamMemsMap[targetTid]?.length) {
                const ballBase = (cnt * ball) * maxN;
                teamMemsMap[targetTid].forEach(p => sc[p.id] -= (ballBase / teamMemsMap[targetTid].length));
                teamMems.forEach(p => sc[p.id] += (ballBase / teamMems.length));
            }
        }
    });
    return { sc };
}

// 介面渲染
function render() {
    const { sc } = calculate();
    const onlineP = players.filter(p => p && p.name && !p.name.startsWith('OFF_'));
    const offlineP = players.filter(p => p && p.name && p.name.startsWith('OFF_'));

    // 戰場 - 上線球員
    document.getElementById('p-grid').innerHTML = onlineP.map(p => {
        const tid = playerTeams[p.id] || 0;
        const s = Math.round(sc[p.id] || 0);
        return `<div class="p-btn ${tid?'t-'+tid:''}" onclick="togglePT(${p.id})">
            ${s !== 0 ? `<div class="score-badge ${s>0?'win-tag':'loss-tag'}">${s>0?'+'+s:s}</div>` : ''}
            ${p.name}
        </div>`;
    }).join('');

    // 戰場 - 快速上線
    document.getElementById('quick-offline').innerHTML = offlineP.map(p => `
        <div class="q-btn" onclick="toggleOnOff(${p.id},'${p.name}', false)">＋ ${p.name.replace('OFF_','')}</div>
    `).join('') || '<span style="color:#444">全員已上線</span>';

    // 隊伍卡片
    document.getElementById('team-list').innerHTML = teams.map(t => {
        const mems = players.filter(p => playerTeams[p.id] == t.id);
        const tScore = mems.reduce((sum, p) => sum + (sc[p.id] || 0), 0);
        const bc = ['','var(--blue)','var(--red)','#a855f7','#ec4899'][t.id] || '#555';
        let eggHtml = '';
        for(let i=1; i<=4; i++) eggHtml += `<div class="egg-circle ${t.e >= i?'active':''}" onclick="adjE(${t.id},${i})">${i}媽</div>`; 
        const detailHtml = mems.length ? `<div class="t-detail">${mems.map(m => `${m.name}:<b>${Math.round(sc[m.id])}</b>`).join(' | ')}</div>` : '<div class="t-detail">尚未分配隊員</div>';

        return `<div class="card" style="border-left: 6px solid ${bc}">
            <button class="del-team" onclick="removeTeam(${t.id})">✕</button>
            <b style="font-size:16px; color:${bc}">第 ${t.id} 隊 <small style="color:var(--gray); font-size:11px;">(${mems.length}人)</small></b>
            <div style="display:flex; justify-content:space-between; ali
