<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE BIZ HUB</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { --blue: #00d2ff; --gold: #ffa502; --bg: #0d1117; --card: #1c222b; --border: #30363d; }
        body { background: var(--bg); color: #e6edf3; font-family: sans-serif; padding: 15px; max-width: 500px; margin: 0 auto; }
        .box { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 15px; margin-bottom: 10px; }
        select, input, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; border: 1px solid var(--border); background: #000; color: #fff; box-sizing: border-box; }
        .btn { background: linear-gradient(135deg, var(--blue), #0072ff); font-weight: bold; cursor: pointer; border: none; font-size: 16px; }
        .label { font-size: 12px; color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="color: var(--blue); text-align: center;">💎 ELITE 數據查詢</h2>

    <div class="box">
        <span class="label">業務對象</span>
        <select id="p-sel"><option value="ALL">🌐 全體成員公開</option></select>
        
        <span class="label">查詢類型</span>
        <select id="t-sel">
            <option value="HISTORY_RANK">🏆 歷史戰績排行 (解析 History)</option>
            <option value="SMART_EXP">💸 智慧雜支分錢 (排除遊戲匯入)</option>
            <option value="CURR_WALLET">🧾 當前錢包狀態 (Players)</option>
        </select>
        
        <span class="label">日期 (未選則為今天)</span>
        <div style="display: flex; gap: 5px;">
            <input type="date" id="d-start">
            <input type="date" id="d-end">
        </div>
    </div>

    <button class="btn" onclick="runBiz()">🚀 生成並發送卡片</button>

<script>
    const API = 'https://nzuxyiefpenwuqudajdw.supabase.co/rest/v1';
    const KEY = 'sb_publishable_7y2n8zIopxlKEhcsJ05D2A_U89IFgae';
    const HEADERS = { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' };

    async function init() {
        await liff.init({ liffId: "2008868088-9hbWzzlW" });
        const res = await fetch(`${API}/players?select=*&order=name.asc`, { headers: HEADERS });
        const data = await res.json();
        const sel = document.getElementById('p-sel');
        data.filter(p => !p.name.startsWith('OFF_')).forEach(p => sel.add(new Option(p.name, p.name)));
    }

    async function runBiz() {
        const type = document.getElementById('t-sel').value;
        const target = document.getElementById('p-sel').value;
        const today = new Date().toISOString().split('T')[0];
        const start = document.getElementById('d-start').value || today;
        const end = document.getElementById('d-end').value || start;

        let flex;

        if (type === 'HISTORY_RANK') {
            // 解析 History 表中的 description 欄位
            const data = await fetch(`${API}/history?created_at=gte.${start}T00:00:00&created_at=lte.${end}T23:59:59`, { headers: HEADERS }).then(r => r.json());
            flex = parseHistoryToRank(data, start);
        } 
        else if (type === 'SMART_EXP') {
            // 智慧分錢：只抓 type 為 exp 的 ledger_logs
            const logs = await fetch(`${API}/ledger_logs?type=eq.exp&created_at=gte.${start}T00:00:00`, { headers: HEADERS }).then(r => r.json());
            const players = await fetch(`${API}/players?select=name`, { headers: HEADERS }).then(r => r.json());
            flex = buildExpCard(logs, players.length, start);
        }
        else if (type === 'CURR_WALLET') {
            const p = await fetch(`${API}/players?name=eq.${target}`, { headers: HEADERS }).then(r => r.json());
            flex = buildWalletCard(target, p[0]);
        }

        liff.shareTargetPicker([{ "type": "flex", "altText": "ELITE 數據報表", "contents": flex }]);
    }

    // 解析 History 字串邏輯 (針對：💰 結單：Fan祐銘:25 | hsuan秉軒:213...)
    function parseHistoryToRank(data, date) {
        let scores = {};
        data.forEach(item => {
            const desc = item.description || "";
            // 使用正規表達式抓取 姓名:數字
            const matches = desc.matchAll(/([\u4e00-\u9fa5\w]+):(-?\d+)/g);
            for (const match of matches) {
                const name = match[1];
                const score = parseInt(match[2]);
                scores[name] = (scores[name] || 0) + score;
            }
        });

        const list = Object.entries(scores).sort((a,b) => b[1]-a[1]);
        return {
            "type": "bubble", "body": { "type": "box", "layout": "vertical", "backgroundColor": "#000000", "contents": [
                { "type": "text", "text": "🏆 歷史戰績累計", "color": "#ffa502", "weight": "bold" },
                { "type": "text", "text": date + " 數據解析", "size": "xxs", "color": "#888888" },
                { "type": "separator", "margin": "md" },
                { "type": "box", "layout": "vertical", "margin": "md", "spacing": "sm", "contents": list.map(([n, v]) => ({
                    "type": "box", "layout": "horizontal", "contents": [
                        { "type": "text", "text": n, "color": "#ffffff", "size": "sm" },
                        { "type": "text", "text": v > 0 ? `+${v}` : `${v}`, "color": v >= 0 ? "#00d2ff" : "#ff4757", "align": "end", "weight": "bold" }
                    ]
                }))}
            ]}
        };
    }

    function buildExpCard(logs, pCount, date) {
        const total = logs.reduce((sum, l) => sum + (parseInt(l.total_amount) || 0), 0);
        const per = Math.round(total / pCount);
        return {
            "type": "bubble", "body": { "type": "box", "layout": "vertical", "backgroundColor": "#1c222b", "contents": [
                { "type": "text", "text": "💸 今日雜支分錢", "color": "#ffa502", "weight": "bold" },
                { "type": "text", "text": `$${total}`, "size": "xxl", "color": "#ffffff", "weight": "bold", "margin": "sm" },
                { "type": "text", "text": "已排除遊戲重複數據 (Type: exp)", "size": "xxs", "color": "#888888" },
                { "type": "box", "layout": "horizontal", "margin": "lg", "contents": [
                    { "type": "text", "text": `分攤人數: ${pCount}`, "color": "#aaaaaa", "size": "xs" },
                    { "type": "text", "text": `每人: $${per}`, "color": "#00d2ff", "align": "end", "weight": "bold" }
                ]}
            ]}
        };
    }

    function buildWalletCard(name, p) {
        return {
            "type": "bubble", "body": { "type": "box", "layout": "vertical", "backgroundColor": "#13171f", "contents": [
                { "type": "text", "text": "🧾 當前錢包狀態", "color": "#00d2ff", "weight": "bold" },
                { "type": "text", "text": name, "color": "#ffffff", "size": "xl", "margin": "md" },
                { "type": "box", "layout": "vertical", "margin": "md", "contents": [
                    { "type": "box", "layout": "horizontal", "contents": [{ "type": "text", "text": "餘額", "color": "#888888" }, { "type": "text", "text": `$${p?p.money:0}`, "color": "#2ecc71", "align": "end" }] },
                    { "type": "box", "layout": "horizontal", "contents": [{ "type": "text", "text": "欠款", "color": "#888888" }, { "type": "text", "text": `$${p?p.debt:0}`, "color": "#ff4757", "align": "end" }] }
                ]}
            ]}
        };
    }

    window.onload = init;
</script>
</body>
</html>
