<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE BATTLE SYSTEM</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root {
            --gold: #FFD700;
            --dark-bg: #0d1117;
            --card-bg: #161b22;
            --text-gray: #8b949e;
        }
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .user-info {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
        }
        .user-info img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
            border: 1px solid var(--gold);
        }
        .elite-card {
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: var(--gold); letter-spacing: 2px; font-size: 1.5rem; margin-bottom: 5px; }
        p { color: var(--text-gray); font-size: 0.9rem; }
        
        .btn-group { width: 100%; margin-top: 30px; }
        .btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-gold {
            background: linear-gradient(45deg, #FFD700, #b8860b);
            color: black;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
        }
        .btn:active { transform: scale(0.98); opacity: 0.8; }
    </style>
</head>
<body>

    <div class="user-info" id="userInfo" style="display: none;">
        <img id="userImg" src="" alt="">
        <span id="userName">菁英成員</span>
    </div>

    <div class="elite-card">
        <h1>ELITE</h1>
        <p>PREMIUM BATTLE & LEDGER</p>
        <hr style="border: 0; border-top: 1px solid #30363d; margin: 20px 0;">
        
        <div id="status">系統初始化中...</div>

        <div class="btn-group">
            <button class="btn btn-gold" onclick="sendBattleReport()">📤 發送黑金戰報卡片</button>
            <button class="btn btn-outline" onclick="liff.closeWindow()">關閉系統</button>
        </div>
    </div>

    <script>
        const LIFF_ID = "2008868088-9hbWzzlW";

        async function initLIFF() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isInClient()) {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        displayUserInfo();
                    }
                } else {
                    document.getElementById('status').innerText = "瀏覽器預覽模式";
                }
            } catch (err) {
                console.error("LIFF 初始化失敗", err);
                document.getElementById('status').innerText = "環境載入失敗";
            }
        }

        async function displayUserInfo() {
            const profile = await liff.getProfile();
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('userImg').src = profile.pictureUrl;
            document.getElementById('userName').innerText = profile.displayName;
            document.getElementById('status').innerText = "ELITE 身份已驗證";
        }

        async function sendBattleReport() {
            if (!liff.isInClient()) {
                alert("請在 LINE App 中開啟以發送卡片");
                return;
            }

            // 檢查是否開啟 ShareTargetPicker 權限
            if (!liff.isApiAvailable('shareTargetPicker')) {
                alert("請在 LINE Developers 開啟 shareTargetPicker 權限");
                return;
            }

            const result = await liff.shareTargetPicker([
                {
                    "type": "flex",
                    "altText": "🏆 ELITE 菁英戰報",
                    "contents": {
                        "type": "bubble",
                        "styles": {
                            "header": { "backgroundColor": "#000000" },
                            "body": { "backgroundColor": "#1a1a1a" },
                            "footer": { "backgroundColor": "#1a1a1a" }
                        },
                        "header": {
                            "type": "box", "layout": "vertical", "contents": [
                                { "type": "text", "text": "ELITE SYSTEM", "color": "#FFD700", "weight": "bold", "size": "sm" }
                            ]
                        },
                        "body": {
                            "type": "box", "layout": "vertical", "contents": [
                                { "type": "text", "text": "本日數據更新", "color": "#ffffff", "size": "xl", "weight": "bold" },
                                { "type": "text", "text": "戰場積分與金庫餘額已同步雲端。", "color": "#aaaaaa", "size": "sm", "margin": "md", "wrap": true },
                                { "type": "separator", "margin": "xl", "color": "#333333" }
                            ]
                        },
                        "footer": {
                            "type": "box", "layout": "vertical", "contents": [
                                {
                                    "type": "button",
                                    "style": "primary",
                                    "color": "#FFD700",
                                    "action": {
                                        "type": "uri",
                                        "label": "查看完整明細",
                                        "uri": "https://liff.line.me/" + LIFF_ID
                                    }
                                }
                            ]
                        }
                    }
                }
            ]);

            if (result) alert("戰報已發送至群組！");
        }

        window.onload = initLIFF;
    </script>
</body>
</html>
